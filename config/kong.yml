_format_version: "3.0"
_transform: true

services:
  - name: echo-service
    url: http://echo-service:80
    routes:
      - name: echo-route
        paths:
          - /echo
        strip_path: true

    plugins:
      - name: rate-limiting
        config:
          minute: 5
          policy: redis
          redis:
            host: redis
            port: 6379
    # UNCHANGED: your existing echo-service block, untouched

  - name: graphql-service                    # routes to Apollo Gateway
    url: http://apollo-gateway:4000
    routes:
      - name: graphql-public-route            # no token needed — for login/register
        paths:
          - /graphql/public
        strip_path: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /graphql
      - name: graphql-protected-route         # token required — for everything else
        paths:
          - /graphql
        strip_path: false
        plugins:
          - name: jwt
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: redis
          redis:
            host: redis
            port: 6379
      - name: cors                            # NEW: lets the React frontend call these routes
        config:                               # from the browser (both public and JWT-protected).
          origins:
            - http://localhost:5173           # Vite dev server
            - http://localhost:3000
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
          credentials: true
          max_age: 3600

consumers:                                    # registers auth-service as a trusted token issuer
  - username: auth-service-issuer
    jwt_secrets:
      - algorithm: HS256
        key: auth-service-issuer
        secret: this-is-a-placeholder-secret-change-me-32bytes
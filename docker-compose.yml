version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pg-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pg-network
    restart: unless-stopped
    depends_on:
      - kong1
      - kong2

  kong1:
    image: kong:3.7
    container_name: pg-kong-1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./config/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8011:8001"
    networks:
      - pg-network
    restart: unless-stopped
    depends_on:
      - echo-service
      - redis

  kong2:
    image: kong:3.7
    container_name: pg-kong-2
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./config/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8021:8001"
    networks:
      - pg-network
    restart: unless-stopped
    depends_on:
      - echo-service
      - redis

  redis:
    image: redis:7-alpine
    container_name: pg-redis
    ports:
      - "6379:6379"
    networks:
      - pg-network
    restart: unless-stopped

  echo-service:
    image: kennethreitz/httpbin
    container_name: pg-echo
    networks:
      - pg-network
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.19
    container_name: pg-consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0 -ui"
    networks:
      - pg-network
    restart: unless-stopped

  authdb:
    image: postgres:16-alpine
    container_name: pg-authdb
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    ports:
      - "5432:5432"
    volumes:
      - authdb-data:/var/lib/postgresql/data
    networks:
      - pg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    container_name: pg-auth
    ports:
      - "8083:8083"
    networks:
      - pg-network
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_started
      redis:
        condition: service_started
      authdb:
        condition: service_healthy

  apollo-gateway:
    build:
      context: ./apollo-gateway
    container_name: pg-apollo-gateway
    ports:
      - "4000:4000"
    networks:
      - pg-network
    restart: unless-stopped
    depends_on:
      - auth-service

  frontend:
    build:
      context: ./frontend
    container_name: pg-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - pg-network
    restart: unless-stopped
    depends_on:
      - nginx

networks:
  pg-network:
    driver: bridge

volumes:
  authdb-data: